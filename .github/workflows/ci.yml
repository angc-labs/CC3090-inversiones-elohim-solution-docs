name: Docs CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout docs repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Run typecheck
        run: npm run typecheck

      - name: Build static docs site
        run: npm run build

      - name: Build Docker image
        run: docker build -t elohim-docs:ci .

      - name: Start docs container
        run: |
          docker run -d --rm \
            --name elohim-docs-ci \
            -p 3001:3001 \
            -e PORT=3001 \
            elohim-docs:ci

      - name: Verify docs HTTP availability
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:3001/ --output /dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Docs did not respond on port 3001"
              docker logs elohim-docs-ci
              exit 1
            fi
            sleep 5
          done

      - name: Export validated docs image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save elohim-docs:ci | gzip > "${RUNNER_TEMP}/docs-image.tar.gz"

      - name: Upload validated docs image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docs-image
          path: ${{ runner.temp }}/docs-image.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Show docs container logs
        if: always()
        run: |
          docker ps -a || true
          docker logs elohim-docs-ci || true

      - name: Clean up docs container
        if: always()
        run: docker rm -f elohim-docs-ci || true
